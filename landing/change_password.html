<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сброс пароля</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f7f3ef] min-h-screen flex items-center justify-center p-4">
  <div class="flex flex-col md:flex-row items-center space-y-6 md:space-y-0 md:space-x-12">
    <!-- Левая часть: изображение -->
    <img src="static/img/forgot_password.svg" alt="Forgot Password" class="max-w-xs w-full h-auto">

    <!-- Правая часть: форма -->
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md relative">
      <!-- Иконка логотипа -->
      <img src="https://img.icons8.com/ios-filled/50/000000/w.png" class="absolute -top-5 -right-5 w-10 rotate-[20deg]" alt="W">

      <!-- Кнопка закрытия -->
      <button class="absolute top-4 right-4 text-gray-400 hover:text-black text-lg font-semibold">&times;</button>

      <h2 class="text-2xl font-bold mb-2">Забыли пароль?</h2>
      <p class="text-gray-600 mb-6">Вам не о чем беспокоиться, мы отправим вам сообщение, которое поможет вам сбросить пароль.</p>

      <form id="reset-form" class="space-y-4">
        <div>
          <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">Новый пароль</label>
          <input type="password" id="newPassword" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required />
        </div>
        <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md">
          Изменить пароль
        </button>
      </form>
      

      <div class="mt-4">
        <a href="forgot_password.html" class="flex items-center text-sm text-gray-700 hover:underline">
          <span class="mr-1">←</span> Назад
        </a>
      </div>
    </div>
  </div>
</body>

<script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("reset-form");
  
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
  
        const username = sessionStorage.getItem("resetEmail");
        const newPassword = document.getElementById("newPassword").value;
  
        try {
          const response = await fetch("http://localhost:8080/auth/change-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ username, newPassword })
          });
  
          if (response.ok) {
            //alert("Пароль успешно изменён");
            window.location.href = "login.html";
          } else {
            const message = await response.text();
            alert("Ошибка: " + message);
          }
        } catch (error) {
          alert("Ошибка соединения с сервером");
          console.error(error);
        }
      });
    });
  </script>
  
</html>
